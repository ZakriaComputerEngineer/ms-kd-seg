[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msdistill"
version = "1.0.0"
description = "Region-decoupled distillation of a transformer teacher for CPU-deployable MS lesion segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "multiple-sclerosis", "lesion-segmentation", "knowledge-distillation",
    "medical-imaging", "model-compression", "class-imbalance",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.30",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "nibabel>=5.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/zakriamehmood/ms-kd-seg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Correctness rules only. Import ordering and pyupgrade rewrites are omitted on
# purpose: the notebook is generated by inlining these modules verbatim, so
# churn in import blocks shows up as notebook diffs for no benefit.
select = ["F", "E9", "B"]
ignore = [
    "B008",  # function call in a default argument -- not used harmfully here
]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces.
"src/msdistill/__init__.py" = ["F401"]
"src/msdistill/models/__init__.py" = ["F401"]
