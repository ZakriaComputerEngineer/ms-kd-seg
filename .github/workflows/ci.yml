name: CI

# Every gate that protects a defect this project has actually shipped:
#   - unit tests cover the empty-class metric convention and the degenerate
#     feature-loss optimum, both of which previously produced wrong numbers
#     without failing
#   - the smoke test runs the entire pipeline on synthetic data
#   - the notebook is rebuilt from src/ and checked to fail if it has drifted
#   - the manuscript is statically checked for dangling citations and length

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only: CI has no GPU and the CUDA build is a 2 GB download.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check src scripts tests

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: End-to-end smoke test on synthetic data
        run: python scripts/smoke_test.py

      - name: Notebook is in sync with src/
        run: |
          python scripts/build_notebook.py
          git diff --exit-code notebooks/ || {
            echo "::error::notebooks/ is stale. Run scripts/build_notebook.py and commit the result."
            exit 1
          }

      - name: Notebook executes cleanly
        run: python scripts/validate_notebook.py

      - name: Manuscript static check
        # The paper lives one level above the repository in the working tree; skip
        # when it is not checked out alongside.
        run: |
          if [ -f ../main.tex ]; then
            python scripts/check_latex.py
          else
            echo "main.tex not present in this checkout; skipping"
          fi
